[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mobilis"
version = "0.1.0"
description = "Bibliothèque de traitement des données Mobilis"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5"]

# À compléter : la commande installée (section [project.scripts])

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mobilis = ["py.typed"]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
